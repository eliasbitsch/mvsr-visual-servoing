perception_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/camera/color/image_raw
    device: cuda
    score_threshold: 0.3
    # Drop the track after this many consecutive detector calls without the object
    max_missed_detections: 3
    # Frames kept to replay the tracker from the (old) frame a detection belongs to
    frame_buffer_size: 150
    publish_debug_image: true

ibvs_node:
  ros__parameters:
    use_sim_time: true
    camera_info_topic: /camera/camera/color/camera_info
    base_frame: base_link
    ee_frame: tool0
    camera_frame: camera_color_optical_frame
    arm_joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_topic: /arm_velocity_controller/commands
    rate: 50.0

    gain: 0.6
    # Desired features (reference pose). Overwritten by ~/capture_reference.
    # u/v < 0 means principal point.
    desired_u: -1.0
    desired_v: -1.0
    desired_area: 9000.0
    desired_angle: 0.0
    # Camera-to-object distance in the reference pose; scales the normalised area feature
    desired_depth: 0.35
    control_yaw: false
    # Keep the optical axis vertical with forward kinematics (allowed by the spec)
    align_optical_axis_down: true
    align_gain: 1.0

    max_linear_speed: 0.10
    max_angular_speed: 0.5
    joint_speed_scale: 0.5
    joint_limit_margin: 0.1
    dls_damping: 0.05
    feature_timeout: 0.5
    converged_threshold: 0.01
    converged_hold_time: 1.0
