# Windows + WSL2 (Docker Engine inside WSL Ubuntu), NVIDIA GPU via Mesa's d3d12 driver on /dev/dxg.
# Not part of the lecturer's package; same GPU setup as ../../compose.wsl.yaml.
#   docker compose -f docker-compose.yml -f docker-compose.wsl.yml build
#   docker compose -f docker-compose.yml -f docker-compose.wsl.yml run --rm sim ros2 launch vs_sim vs_sim.launch.py
services:
  sim:
    devices: !override
      - /dev/dxg:/dev/dxg
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      - LIBGL_ALWAYS_SOFTWARE=0
      # WSL mirrored networking loses gz multicast discovery without these
      - GZ_IP=127.0.0.1
      - GZ_PARTITION=vs_lab
    volumes:
      - /mnt/wslg:/mnt/wslg:rw
      - /usr/lib/wsl:/usr/lib/wsl:ro
