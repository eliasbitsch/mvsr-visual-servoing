# Windows + WSL2 (Docker Engine inside the WSL Ubuntu), same GPU setup as PRO-LAB / AROBL:
# Gazebo and RViz render through Mesa's d3d12 driver on /dev/dxg, CUDA (PyTorch) uses the
# libcuda.so that Windows exposes in /usr/lib/wsl/lib. No nvidia runtime needed.
services:
  dev:
    devices:
      - /dev/dxg:/dev/dxg
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      - LIBGL_ALWAYS_SOFTWARE=0
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg:rw
      - /usr/lib/wsl:/usr/lib/wsl:ro
