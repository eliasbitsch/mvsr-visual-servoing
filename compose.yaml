# Base service. GPU and GUI come from override files, picked per machine via COMPOSE_FILE in .env
# (see .env.example and README.md). VLM server: `docker compose --profile vlm up -d`.
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-fm}
    image: mvsr-vs:${IMAGE_TARGET:-fm}
    container_name: mvsr-vs
    stdin_open: true
    tty: true
    ipc: host
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Without these, ros_gz_sim under WSL mirrored networking never finds the world (AROBL E-024)
      - GZ_PARTITION=mvsr_vs
      - GZ_IP=127.0.0.1
      - VS_OLLAMA_URL=${VS_OLLAMA_URL:-http://localhost:11435}
      - VS_OLLAMA_MODEL=${VS_OLLAMA_MODEL:-qwen3-vl:8b-instruct}
    volumes:
      - ./ros2_ws/src:/ros2_ws/src
      - ws-build:/ros2_ws/build
      - ws-install:/ros2_ws/install
      - ws-log:/ros2_ws/log
      - models:/models
      - ./data:/data

  # VLM server for the ollama_vlm detector. Port 11435 so it does not clash with an Ollama
  # that may already run on the host (11434).
  ollama:
    image: ollama/ollama:0.40.14
    profiles: [vlm]
    container_name: mvsr-ollama
    network_mode: host
    environment:
      - OLLAMA_HOST=127.0.0.1:11435
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Pulls the VLMs once into the ollama volume, then exits
  ollama-pull:
    image: ollama/ollama:0.40.14
    profiles: [vlm]
    network_mode: host
    depends_on: [ollama]
    environment:
      - OLLAMA_HOST=127.0.0.1:11435
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in ${VS_OLLAMA_MODELS:-qwen3-vl:8b-instruct gemma4:e4b}; do ollama pull "$$m"; done

volumes:
  ws-build:
  ws-install:
  ws-log:
  models:
  ollama:
